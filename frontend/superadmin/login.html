
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — LendOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    body { font-family: 'Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif; background: #f0f1f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .login-box { background: white; border: 1px solid #d4d7e3; border-radius: 12px; padding: 34px; width: 100%; max-width: 380px; }
    .login-title { font-size: 22px; font-weight: 700; color: #0f0e1a; margin-bottom: 4px; }
    .login-sub { font-size: 14px; color: #4a4a6a; margin-bottom: 26px; }
    label { font-size: 13px; font-weight: 600; color: #4a4a6a; display: block; margin-bottom: 5px; }
    input { width: 100%; height: 42px; border: 1.5px solid #d4d7e3; border-radius: 8px; padding: 0 13px; font-size: 15px; color: #0f0e1a; font-family: inherit; box-sizing: border-box; margin-bottom: 17px; }
    input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    button { width: 100%; height: 44px; background: #1b5068; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #3730a3; }
    #err { color: #dc2626; font-size: 13.5px; margin-top: 13px; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-title">Super Admin</div>
    <div class="login-sub">LendOS platform administration</div>
    <label>Email</label>
    <input type="email" id="email"/>
    <label>Password</label>
    <input type="password" id="password"/>
    <button onclick="login()">Sign In</button>
    <div id="err"></div>
  </div>
  <script>
    const API = 'http://localhost:8000';
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';
      try {
        const res = await fetch(`${API}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed.');
        localStorage.setItem('admin_token', data.access_token);
        localStorage.setItem('admin_name', data.full_name);
        window.location.href = '/admin/overview';
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
